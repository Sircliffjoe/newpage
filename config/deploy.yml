# Kamal Deployment Configuration — NewPage Integrity Travels & Tours
# Target: Contabo VPS (169.58.122.43) | Domain: newpageintegritytravels.com

service: newpage
image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "sircliffjoe") %>/newpage

servers:
  web:
    - 169.58.122.43

proxy:
  ssl: true
  hosts:
    - newpageintegritytravels.com
    - www.newpageintegritytravels.com

registry:
  # Update to your Docker Hub / GHCR username in .kamal/secrets
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - NEWPAGE_DATABASE_PASSWORD
    - BREVO_API_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 2
    RAILS_LOG_LEVEL: info
    APP_HOST: newpageintegritytravels.com
    DB_HOST: newpage-db
    BREVO_SENDER_EMAIL: info@newpageintegritytravels.com
    BREVO_SENDER_NAME: NewPage Integrity Travels
    ADMIN_NOTIFICATION_EMAIL: newpageintegritytravels@gmail.com

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent ActiveStorage volume so uploaded CMS images survive every deploy
volumes:
  - "newpage_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16-alpine
    host: 169.58.122.43
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: newpage
        POSTGRES_DB: newpage_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
